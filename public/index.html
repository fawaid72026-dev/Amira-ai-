<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amira AI — Fashion Affiliate Studio</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#292333;background:#f7f3f7}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:760px;margin:auto}.hero{background:linear-gradient(135deg,#49334f,#9b718e);color:white;padding:26px;border-radius:20px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:32px}.card{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 5px 24px #38213a12}label{display:block;font-weight:650;margin:14px 0 7px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd2df;border-radius:10px;font:inherit;background:white}textarea{min-height:80px}button{border:0;background:#65466d;color:white;padding:13px 18px;border-radius:11px;font-weight:700;font-size:15px;cursor:pointer;margin:8px 6px 0 0}.secondary{background:#eee7ef;color:#49334f}.hint{color:#766d79;font-size:13px}.result{white-space:pre-wrap;line-height:1.55;background:#fbf9fb;border:1px solid #e9e0ea;padding:15px;border-radius:12px;overflow-wrap:anywhere}.hidden{display:none}
</style></head><body><main class="wrap">
<header class="hero"><h1>Amira AI</h1><div>Fashion Affiliate Prompt Studio</div><p>Buat prompt Google Flow yang konsisten, natural, dan siap digunakan.</p></header>
<section class="card"><h2>1. Referensi karakter & produk</h2><label>Foto karakter DT-CIA</label><input id="character" type="file" accept="image/*"><label>Foto produk (bisa lebih dari satu)</label><input id="products" type="file" accept="image/*" multiple><p class="hint">Gunakan foto yang jelas. Unggah foto karakter dan produk sebelum membuat prompt.</p></section>
<section class="card"><h2>2. Atur video</h2><label>Durasi total</label><select id="duration"><option value="15">15 detik</option><option value="18">18 detik</option><option value="20" selected>20 detik</option></select><label>Konsep video</label><textarea id="concept" placeholder="Contoh: review outfit elegan, transisi natural, gaya UGC..."></textarea><label>Lokasi / latar</label><input id="location" placeholder="Contoh: butik minimalis, kamar terang"><label>Gaya suara</label><input id="voice" placeholder="Contoh: perempuan Indonesia, hangat, natural"><label>CTA</label><input id="cta" placeholder="Contoh: cek detail produknya di etalase"><label>Catatan karakter</label><textarea id="notes" placeholder="Hijab taupe/beige, wajah dan proporsi tetap konsisten; pakaian mengikuti produk."></textarea><button id="generate">Buat Prompt Amira AI</button></section>
<section class="card hidden" id="outputCard"><h2>Hasil Prompt</h2><div id="output" class="result"></div><button class="secondary" id="copy">Salin hasil</button><button class="secondary" id="download">Unduh TXT</button></section>
</main><script>
const toDataURL=file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
async function images(files){const out=[];for(const f of files)out.push(await toDataURL(f));return out}
document.getElementById("generate").onclick=async()=>{const btn=document.getElementById("generate"),out=document.getElementById("output"),card=document.getElementById("outputCard");try{btn.disabled=true;btn.textContent="Sedang membuat prompt...";const c=document.getElementById("character").files[0],p=[...document.getElementById("products").files];if(!c||!p.length)throw new Error("Unggah foto karakter dan minimal satu foto produk terlebih dahulu.");const payload={characterImage:await toDataURL(c),productImages:await images(p),duration:document.getElementById("duration").value,concept:document.getElementById("concept").value,location:document.getElementById("location").value,voice:document.getElementById("voice").value,cta:document.getElementById("cta").value,characterNotes:document.getElementById("notes").value};const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.error||"Gagal membuat prompt.");out.textContent=data.result;card.classList.remove("hidden");card.scrollIntoView({behavior:"smooth"});}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent="Buat Prompt Amira AI"}};
document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(document.getElementById("output").textContent);
document.getElementById("download").onclick=()=>{const a=document.createElement("a"),b=new Blob([document.getElementById("output").textContent],{type:"text/plain"});a.href=URL.createObjectURL(b);a.download="amira-ai-prompt.txt";a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
